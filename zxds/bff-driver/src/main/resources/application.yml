  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

sa-token:
  # HTTP请求头中token的名称
  token-name: token
  # token有效期，单位s 默认30天，-1代表永不过期
  timeout: 864000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位：秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录，为false时新登录挤掉旧登录)
  allow-concurrent-login: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token，为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 读取Cookie中Token
  isReadCookie: false

springdoc:
  api-docs:
    enabled: true
    path: /doc-api.html
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: on

# ============== 启用并配置Seata分布式事务 ==============
seata:
  enabled: true  # 启用Seata
  application-id: ${spring.application.name}  # 应用ID
  tx-service-group: bff_driver_tx_group  # BFF专属事务组名
  service:
    vgroup-mapping:
      # 关键：映射到Seata Server的集群名，必须与子系统和Seata Server配置一致
      bff_driver_tx_group: default
    grouplist:
      default: 192.168.91.129:8091

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 300000